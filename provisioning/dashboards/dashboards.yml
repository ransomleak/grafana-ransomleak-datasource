apiVersion: 1

# Dev-only: auto-load the bundled dashboard from the mounted plugin dist so it
# renders immediately against the provisioned RansomLeak datasource. In a real
# install, users import this dashboard from the plugin's "Dashboards" tab.
providers:
  - name: RansomLeak bundled
    orgId: 1
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/plugins/ransomleak-ransomleak-datasource/dashboards
      foldersFromFilesStructure: false
